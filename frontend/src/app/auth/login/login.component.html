<section class="auth-page">
  <div class="auth-shell">
    <article class="auth-panel login-panel">
      <span class="auth-kicker">Acceso seguro</span>
      <h1>Iniciar sesión</h1>
      <p class="auth-subtitle">Vuelve a tus partidos, canchas y reservas.</p>

      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      <form class="auth-form" (submit)="onSubmit($event)">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" [(ngModel)]="email" name="email" autocomplete="email" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" [(ngModel)]="password" name="password" autocomplete="current-password" placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn-submit">Ingresar</button>
      </form>
    </article>

    <article class="auth-panel register-panel">
      <div class="register-invite">
        <span class="auth-kicker">Tu próxima fecha empieza aquí</span>
        <h2>¿Aún no tienes cuenta?</h2>
        <p>Crea tu perfil como jugador o administra tu cancha con un proceso guiado y transparente.</p>
        <a routerLink="/register" class="btn-register">Crear mi cuenta</a>
      </div>
    </article>
  </div>
</section>
