<main class="teams-page"><span class="eyebrow">{{id?'Administración':'Nuevo equipo'}}</span><h1>{{id?'Editar equipo':'Crea tu equipo'}}</h1><form class="panel form-grid" [formGroup]="form" (ngSubmit)="save()"><label class="field">Nombre<input formControlName="name">@if(form.controls.name.touched&&form.controls.name.invalid){<small>Usa entre 3 y 80 caracteres.</small>}</label><label class="field">Deporte<select formControlName="sport"><option>Fútbol</option><option>Básquet</option><option>Voleibol</option><option>Tenis</option></select></label><label class="field full">Descripción<textarea formControlName="description"></textarea></label><label class="field">Distrito opcional<input formControlName="district"></label><label class="field">Nivel<select formControlName="competitiveLevel"><option value="BEGINNER">Básico</option><option value="INTERMEDIATE">Intermedio</option><option value="ADVANCED">Avanzado</option></select></label><label class="field">Escudo<input type="file" accept="image/png,image/jpeg,image/webp" (change)="selectLogo($event)"></label><label class="field"><span><input type="checkbox" formControlName="openToRequests"> Abierto a solicitudes</span></label>@if(error){<div class="error field full">{{error}}</div>}<div class="actions field full"><button class="btn btn-primary" [disabled]="loading">{{loading?'Guardando...':'Guardar equipo'}}</button><a class="btn btn-secondary" routerLink="/mis-equipos">Cancelar</a></div></form></main>
