spring.application.name=PartidoYA Platform
spring.profiles.default=local
server.port=${PORT:8080}

documentation.application.description=@project.description@
documentation.application.version=@project.version@

spring.messages.basename=messages
spring.messages.encoding=UTF-8

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

jwt.secret=${JWT_SECRET:partidoya-local-secret-key-must-be-at-least-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

culqi.public-key=${CULQI_PUBLIC_KEY:}
culqi.secret-key=${CULQI_SECRET_KEY:}
culqi.subscription-plan-ids.jugador-plus=${CULQI_PLAN_JUGADOR_PLUS:}
culqi.subscription-plan-ids.cancha-emprendedor=${CULQI_PLAN_CANCHA_EMPRENDEDOR:}
culqi.subscription-plan-ids.cancha-business=${CULQI_PLAN_CANCHA_BUSINESS:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
